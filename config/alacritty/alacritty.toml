[window]
dimensions = { columns = 100, lines = 40 }

[font]
size = 9

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[bell]
duration = 0

[[keyboard.bindings]]
key = "Tab"
mods = "Control"
chars = "\u001b[15~"

[[keyboard.bindings]]
key = "Tab"
mods = "Control|Shift"
chars = "\u001b[17~"

[[keyboard.bindings]]
key = "Return"
mods = "Control"
chars = "\u001b[20~"

[[keyboard.bindings]]
key = "Return"
mods = "Control|Shift"
chars = "\u001b[21~"

[[keyboard.bindings]]
key = "Space"
mods = "Control"
chars = "\u001bOS"

[[keyboard.bindings]]
key = "Back"
mods = "Control"
chars = "\u001bOR"

[[keyboard.bindings]]
key = "Comma"
mods = "Control"
chars = "\u001b[18~"

[[keyboard.bindings]]
key = "Semicolon"
mods = "Control"
chars = "\u001b[19~"
