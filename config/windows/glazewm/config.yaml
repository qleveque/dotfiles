general:
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  show_all_in_taskbar: true

  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'

gaps:
  inner_gap: '0px'

  outer_gap:
    top: '0px'
    right: '0px'
    left: '0px'
    bottom: '10px'

  single_window_outer_gap:
    top: '0px'
    right: '0px'
    left: '0px'
    bottom: '10px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#ffffff'

    corner_style:
      enabled: true
      style: 'square'

  other_windows:
    border:
      enabled: true
      color: '#000000'

    corner_style:
      enabled: true
      style: 'square'

window_behavior:
  initial_state: 'tiling'

  state_defaults:
    floating:
      centered: true
      shown_on_top: false

    fullscreen:
      maximized: true
      shown_on_top: true

workspaces:
  - name: "1_any"
    display_name: "󰋜"
  - name: "2_else"
    display_name: "󰥵"
  - name: "3_web"
    display_name: "󰖟"
  - name: "4_term"
    display_name: ""
  - name: "5_send"
    display_name: "󰭹"
  - name: "6_code"
    display_name: "󰅨"
  - name: "7_gui"
    display_name: "󰇞"
  - name: "8_dash"
    display_name: "󱐋"
  - name: "9_back"
    display_name: "󰀿"
  - name: "10_music"
    display_name: "󰝚"
  - name: "11_post"
    display_name: "󰇮"
  - name: "12_rest"
    display_name: "󰅶"

window_rules:
  - commands: ['ignore']
    match:
      - window_title: { regex: 'Affichage compact de réunion .*' }
      - window_class : { equals: 'VNCMDI_Window' }
      - window_title: { equals: 'DeepL' }

  - commands: ['set-floating']
    match:
      - window_title: { equals: 'SCRATCHPAD' }
      - window_title: { regex: 'Appel vocal.*' }
      - window_process: { equals: 'vncviewer' }
      - window_title: { equals: 'Hue Sync' }

  - commands: ['move --workspace 5_send']
    match:
      - window_process: { equals: 'ms-teams' }
      - window_title: { equals: 'WhatsApp' }
      - window_title: { regex: 'Appel vocal.*' }

  - commands: ['move --workspace 6_code']
    match:
    - window_process: { equals: 'Code' }
    - window_process: { equals: 'pycharm64' }
    - window_process: { equals: 'idea64' }

  - commands: ['move --workspace 8_dash']
    match:
      - window_process: { equals: 'Copilot' }
      - window_title: { regex: 'Microsoft Copilot:.*' }

  - commands: ['move --workspace 9_back']
    match:
      - window_process: { equals: 'vncviewer' }

  - commands: ['move --workspace 10_music']
    match:
      - window_process: { equals: 'Spotify' }

  - commands: ['move --workspace 11_post']
    match:
      - window_process: { equals: 'OUTLOOK' }
      - window_process: { equals: 'olk' }

  - commands: ['move --workspace 12_rest']
    match:
      - window_title: { regex: '.* WhatsApp — .*' }

  - commands: ['move --workspace 7_gui', 'set-floating']
    match:
      - window_process: { equals: 'ANTlab' }
      - window_process: { equals: 'python' }

  - commands: ['move --workspace 9_back', 'set-floating']
    match:
      - window_title: { equals: 'ANT vehicle simulator' }

binding_modes:

keybindings:
