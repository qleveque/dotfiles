watch_stylesheet: true
watch_config: true
debug: false
glazewm:
  start_command: "glazewm.exe"
  stop_command: "taskkill /IM glazewm.exe /F"
  reload_command: "taskkill /IM glazewm.exe /F && glazewm.exe"
bars:
  primary-bar:
    enabled: true
    screens: ["*"] 
    class_name: "yasb-bar"
    alignment:
      position: "bottom"
      center: false
    blur_effect:
      enabled: true
      acrylic: false
      dark_mode: false
      round_corners: false 
      border_color: None 
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 22
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left: ["win"]
      center: ["glazewm_workspaces"]
      right: ["power_menu", "bluetooth", "volume", "clock"]
widgets:
  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      label: "<span>{icon}</span> {device_count}"
      label_alt: "{device_name}"
      label_no_device: "No devices connected"
      label_device_separator: ", "
      max_length: 10
      max_length_ellipsis: "..."
      icons: 
        bluetooth_on: "\udb80\udcaf"
        bluetooth_off: "\udb80\udcb2"
        bluetooth_connected: "\udb80\udcb1"
      device_aliases:
        - name: "T5.0"
          alias: "\uf025"
      callbacks:
        on_left: "exec cmd.exe /c start ms-settings:bluetooth"
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%d/%m/%Y %H:%M}"
      label_alt: "{%A, %d %B %Y %H:%M}"
      timezones: []
  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "GlazeWM Offline"
      hide_empty_workspaces: true
      hide_if_offline: true
      enable_scroll_switching: false
      app_icons:
        enabled_populated: true
        enabled_active: true
        size: 12
        max_icons: 0
        hide_label: false
        hide_duplicates: false
        hide_floating: false
      animation: true
  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "{volume}"
      audio_menu:
        show_apps: true
        show_app_icons: true
        show_apps_expanded: true
  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "\uf011"
      uptime: True
      blur: False
      blur_background: True
      animation_duration: 200
      button_row: 5
      buttons:
        shutdown: ["\uf011","Shut Down"]
        restart: ["\uead2","Restart"]
        signout: ["\udb80\udf43","Sign out"]
        hibernate: ["\uf28e","Hibernate"]
        sleep: ["\u23fe","Sleep"]
        cancel: ["","Cancel"]
  win:
    type: "yasb.custom.CustomWidget"
    options:
      label: ""
      label_alt: "Menu"
      class_name: "win-widget"
      callbacks:
        on_left: "exec start_menu"
