<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Base styles for better consistency across platforms (aka. CSS reset). -->
    <link rel="stylesheet" type="text/css" href="../normalize.css" />

    <!-- Custom styles. -->
    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Allows React to be run buildless via "text/babel" script below. -->
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, {
        useState,
        useEffect,
      } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@2';

      zebar.shellExec('cmd', '/C autohotkey.exe %USERPROFILE%/dotfiles/config/windows/glazewm-utils/glazewm-utils.ahk');

      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        audio: { type: 'audio' }
      });

      const icons = {
        any: 'fa-star',
        else: 'fa-moon',
        web: 'fa-globe',
        term: 'fa-terminal',
        send: 'fa-message',
        code: 'fa-file-lines',
        gui: 'fa-paintbrush',
        dash: 'fa-bolt',
        back: 'fa-cloud',
        music: 'fa-music',
        post: 'fa-envelope',
        rest: 'fa-mug-hot'
      }

      createRoot(document.getElementById('root')).render(<App />);

      function App() {
        const [output, setOutput] = useState(providers.outputMap);

        useEffect(() => {
          providers.onOutput(() => {
            setOutput(providers.outputMap);
          });
        }, []);

        const numberOfWorkspaces = output.glazewm?.currentWorkspaces.length ?? 0;
        const workingRect = output.glazewm?.currentMonitor.workingRect;
        const mainMonitor = workingRect?.left === 0 && workingRect?.top === 0;

        return (
          <div className="app">

            {mainMonitor && output.audio?.defaultPlaybackDevice && output.audio.defaultPlaybackDevice.name.startsWith('Headphones') && (
              <i className='audio fa fa-headset'></i>
            )}

            {mainMonitor && output.glazewm && (
              <>
                {output.glazewm.bindingModes.map(bindingMode => (
                  <button
                    className="binding-mode"
                    key={bindingMode.name}
                  >
                    {bindingMode.displayName ?? bindingMode.name}
                  </button>
                ))}

                <button
                  className="button tiling-direction"
                  onClick={() =>
                    output.glazewm.runCommand('toggle-tiling-direction')
                  }
                >
                  <i
                    className={`button fa tiling-direction ${output.glazewm.tilingDirection === 'horizontal' ? 'fa-left-right' : 'fa-up-down'}`}
                  ></i>
                </button>
              </>
            )}

            {output.glazewm && (
              <div className="workspaces">
                {output.glazewm.currentWorkspaces.map(workspace => (
                  <button
                    className={`
                      workspace
                      ${workspace.hasFocus && 'focused'}
                      ${workspace.isDisplayed && 'displayed'}
                      ${numberOfWorkspaces>6 && 'tight'}
                    `}
                    onClick={() =>
                      output.glazewm.runCommand(
                        `focus --workspace ${workspace.name}`,
                      )
                    }
                    key={workspace.name}
                  >
                    <i
                      className={`
                      fas
                      ${icons[workspace.name]}
                    `}></i>
                  </button>
                ))}
              </div>
            )}
          </div>
        );
      }
    </script>
  </body>
</html>
